{% extends "challenge.html" %}

{% block input %}
<input id="challenge-id" class="challenge-id" type="hidden" value="{{ challenge.id }}">

<style>
#challenge-window .submit-row { display: none !important; }
.econ-modal-link {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 20px;
  border: 1px solid var(--d-hair-strong);
  border-radius: 6px;
  background: var(--d-paper-soft);
  color: var(--d-ink);
}
.econ-modal-link p { margin: 0; color: var(--d-ink-mid); }
.econ-modal-link a { width: fit-content; }
</style>
<div class="econ-modal-link">
  <strong>답안 제출</strong>
  <p>이 문제는 전용 문제 페이지에서 답안을 제출합니다.</p>
  <a class="d-btn d-btn-primary" href="/problems/{{ challenge.id }}">문제 페이지 열기</a>
</div>
{% endblock %}
